[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-assistant"
version = "1.0.0"
description = "Enterprise Knowledge Assistant Backend with Pre-Retrieval RBAC, LlamaIndex Ingestion, and Citation Verification"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "alembic>=1.13.1",
    "PyJWT>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.2",
    "passlib[bcrypt]>=1.7.4",
    "llama-index-core>=0.10.50",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.3",
    "openai>=1.35.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
